<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bilans kaloryczny i planowanie diety</title>
    <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
    <header class="app-header">
        <h1>Bilans kaloryczny i planowanie diety</h1>
        <nav class="tabs">
            <button class="tab active" data-tab="dashboard">Dashboard</button>
            <button class="tab" data-tab="profile">Profil</button>
            <button class="tab" data-tab="products">Produkty</button>
            <button class="tab" data-tab="diary">Dziennik</button>
        </nav>
    </header>

    <main class="container">
        <!-- ================= DASHBOARD ================= -->
        <section id="tab-dashboard" class="tab-panel active">
            <div class="card">
                <div class="row space-between">
                    <h2>Podsumowanie dnia</h2>
                    <input type="date" id="dashboard-date" />
                </div>
                <div id="dashboard-content">
                    <p class="muted">Ładowanie...</p>
                </div>
            </div>
        </section>

        <!-- ================= PROFILE ================= -->
        <section id="tab-profile" class="tab-panel">
            <div class="card">
                <h2>Profil i cel</h2>
                <form id="profile-form" class="form-grid">
                    <label>Płeć
                        <select name="gender" required>
                            <option value="male">Mężczyzna</option>
                            <option value="female">Kobieta</option>
                        </select>
                    </label>
                    <label>Wiek
                        <input name="age" type="number" min="1" max="120" required />
                    </label>
                    <label>Waga (kg)
                        <input name="weight_kg" type="number" step="0.1" min="1" required />
                    </label>
                    <label>Wzrost (cm)
                        <input name="height_cm" type="number" step="0.1" min="1" required />
                    </label>
                    <label>Poziom aktywności
                        <select name="activity_level" required>
                            <option value="sedentary">Siedzący</option>
                            <option value="light">Lekki</option>
                            <option value="moderate" selected>Umiarkowany</option>
                            <option value="active">Aktywny</option>
                            <option value="very_active">Bardzo aktywny</option>
                        </select>
                    </label>
                    <label>Cel
                        <select name="goal" required>
                            <option value="reduction">Redukcja</option>
                            <option value="maintenance" selected>Utrzymanie</option>
                            <option value="bulking">Masa</option>
                        </select>
                    </label>
                    <div class="form-actions">
                        <button type="submit" class="primary">Zapisz profil</button>
                    </div>
                </form>
                <div id="profile-targets" class="targets"></div>
            </div>
        </section>

        <!-- ================= PRODUCTS ================= -->
        <section id="tab-products" class="tab-panel">
            <div class="card">
                <h2>Dodaj produkt</h2>
                <form id="product-form" class="form-grid">
                    <label>Nazwa
                        <input name="name" type="text" required />
                    </label>
                    <label>Kcal / 100 g
                        <input name="kcal_per_100g" type="number" step="0.1" min="0" required />
                    </label>
                    <label>Białko / 100 g
                        <input name="protein_per_100g" type="number" step="0.1" min="0" required />
                    </label>
                    <label>Węglowodany / 100 g
                        <input name="carbs_per_100g" type="number" step="0.1" min="0" required />
                    </label>
                    <label>Tłuszcze / 100 g
                        <input name="fat_per_100g" type="number" step="0.1" min="0" required />
                    </label>
                    <div class="form-actions">
                        <button type="submit" class="primary">Dodaj</button>
                    </div>
                </form>
            </div>
            <div class="card">
                <div class="row space-between">
                    <h2>Baza produktów</h2>
                    <input id="product-search" type="search" placeholder="Szukaj..." />
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Nazwa</th>
                            <th>Kcal</th>
                            <th>B</th>
                            <th>W</th>
                            <th>T</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="products-tbody"></tbody>
                </table>
            </div>
        </section>

        <!-- ================= DIARY ================= -->
        <section id="tab-diary" class="tab-panel">
            <div class="card">
                <h2>Dodaj wpis do dziennika</h2>
                <form id="meal-form" class="form-grid">
                    <label>Data
                        <input name="entry_date" type="date" required />
                    </label>
                    <label>Posiłek
                        <select name="category" required>
                            <option value="breakfast">Śniadanie</option>
                            <option value="lunch">Obiad</option>
                            <option value="dinner">Kolacja</option>
                            <option value="snack">Przekąska</option>
                        </select>
                    </label>
                    <label>Produkt
                        <select name="product_id" id="meal-product-select" required></select>
                    </label>
                    <label>Gramatura (g)
                        <input name="grams" type="number" step="1" min="1" required />
                    </label>
                    <div class="form-actions">
                        <button type="submit" class="primary">Dodaj wpis</button>
                    </div>
                </form>
            </div>
            <div class="card">
                <div class="row space-between">
                    <h2>Dziennik</h2>
                    <input type="date" id="diary-date" />
                </div>
                <div id="diary-content"></div>
            </div>
        </section>
    </main>

    <div id="toast" class="toast"></div>

    <script src="/static/app.js"></script>
</body>
</html>
